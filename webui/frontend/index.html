<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>BitNet WebUI</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <div id="container">
    <aside id="sidebar">
      <button id="new-conv">New Conversation</button>
      <ul id="conv-list"></ul>
    </aside>
    <main id="main">
      <div id="controls">
        <select id="model-select"></select>
        <input id="temperature" type="number" step="0.1" value="0.8" />
        <input id="n-predict" type="number" value="256" />
        <button id="apply">Apply</button>
      </div>
      <div id="chat"></div>
      <form id="chat-form">
        <input id="message" autocomplete="off" />
        <button type="submit">Send</button>
      </form>
    </main>
  </div>
  <script src="app.js"></script>
</body>
</html>
